[package]
name = "ptyx-native-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package.metadata]
cargo-fuzz = true

[dependencies]
libc = "0.2"
libfuzzer-sys = "0.4"
ptyx = { path = "../ptyx" }

[[bin]]
name = "broker_decoder"
path = "fuzz_targets/broker_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "controller_decoder"
path = "fuzz_targets/controller_decoder.rs"
test = false
doc = false
bench = false
