[package]
name = "ptyx-engine"
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
description = "Internal cross-platform PTY engine for the ptyx crate"
license = "MIT"
repository = "https://github.com/bitshifthq/dartio"
readme = "README.md"

[features]
test-controls = []

[dependencies]
bytes = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
