[package]
name = "ptyx-c"
version = "0.0.1"
edition = "2021"
publish = false

[features]
default = []
test-controls = ["ptyx/test-controls"]

[lib]
name = "ptyx_c"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
libc = "0.2"
ptyx = { path = "../ptyx", features = ["__private_adapter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
