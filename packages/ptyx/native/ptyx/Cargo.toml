[package]
name = "ptyx"
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
description = "Opinionated high-throughput cross-platform pseudo-terminal sessions"
license = "MIT"
repository = "https://github.com/bitshifthq/dartio"
readme = "README.md"
keywords = ["pty", "terminal", "conpty", "process"]
categories = ["os", "api-bindings"]

[features]
default = []
__private_adapter = []
test-controls = ["__private_adapter"]

[dependencies]
bytes = "1"
futures-core = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
