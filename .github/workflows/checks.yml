name: checks

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      ptyx: ${{ steps.filter.outputs.ptyx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ptyx:
              - "packages/ptyx/**"
              - "analysis_options.yaml"
              - "all_lint_rules.yaml"
              - "pubspec.yaml"
              - "lefthook.yml"
              - ".github/workflows/pr-check.yml"
              - ".github/workflows/checks.yml"
              - ".github/workflows/build.yml"
              - ".github/workflows/ptyx-extended.yml"
              - ".github/workflows/ptyx-acceptance.yml"
              - ".github/workflows/release-ptyx.yml"

  dart-quality:
    name: dart-quality
    needs: [changes]
    if: needs.changes.outputs.ptyx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-linux-
      - run: dart pub get
      - run: dart format --set-exit-if-changed --output=none packages/ptyx
      - name: verify generated ptyx ABI bindings
        working-directory: packages/ptyx
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code -- \
            native/include/ptyx/ptyx.h \
            native/dart/include/ptyx_dart.h \
            lib/src/ffi/ptyx.g.dart \
      - name: verify generated native asset hashes
        working-directory: packages/ptyx
        run: |
          VERSION="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          dart run tool/generate_binary_hash.dart \
            "ptyx-v$VERSION" \
            lib/src/hook/asset_hashes.dart \
            --check
      - run: dart analyze --fatal-infos --fatal-warnings packages/ptyx
      - name: publish dry run
        working-directory: packages/ptyx
        run: dart pub publish --dry-run

  dart-tests:
    name: dart-tests-${{ matrix.os }}
    needs: [changes, dart-quality]
    if: needs.changes.outputs.ptyx == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-arm64
            runner: macos-15
          - os: macos-x64
            runner: macos-15-intel
          - os: windows-x64
            runner: windows-2025
          - os: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/git
            ~/.cargo/registry
            packages/ptyx/native/target
          key: ptyx-tests-${{ matrix.os }}-${{ hashFiles('packages/ptyx/native/Cargo.lock', '**/pubspec.yaml') }}
          restore-keys: ptyx-tests-${{ matrix.os }}-
      - name: install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: configure Dart SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v dart)")")"
          if command -v cygpath >/dev/null 2>&1; then
            SDK="$(cygpath -w "$SDK")"
          fi
          printf "DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
          printf "PTYX_DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
      - run: dart pub get
      - name: run Dart tests
        working-directory: packages/ptyx
        run: |
          dart test --concurrency=1

  rust:
    name: rust-${{ matrix.os }}
    needs: [changes, dart-quality]
    if: needs.changes.outputs.ptyx == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-arm64
            runner: macos-15
          - os: macos-x64
            runner: macos-15-intel
          - os: windows-x64
            runner: windows-2025
          - os: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            packages/ptyx/native/target
          key: ptyx-rust-${{ matrix.os }}-${{ hashFiles('packages/ptyx/native/Cargo.lock') }}
          restore-keys: ptyx-rust-${{ matrix.os }}-
      - name: install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup component add --toolchain 1.95.0 clippy rustfmt
      - name: configure Dart SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v dart)")")"
          if command -v cygpath >/dev/null 2>&1; then
            SDK="$(cygpath -w "$SDK")"
          fi
          printf "DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
          printf "PTYX_DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
      - name: build Unix broker
        if: runner.os != 'Windows'
        run: |
          cargo build --manifest-path packages/ptyx/native/broker/Cargo.toml --release
          printf "PTYX_BROKER_BINARY=%s\n" \
            "$GITHUB_WORKSPACE/packages/ptyx/native/target/release/ptyx-broker" \
            >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path packages/ptyx/native/Cargo.toml --all -- --check
      - if: runner.os != 'Windows'
        run: cargo fmt --manifest-path packages/ptyx/native/broker/Cargo.toml -- --check
      - run: >-
          cargo test --manifest-path packages/ptyx/native/Cargo.toml
          -p ptyx-c -p ptyx-dart -p ptyx --all-features
      - run: cargo build --manifest-path packages/ptyx/native/Cargo.toml
      - name: run C ABI harness
        if: runner.os != 'Windows'
        run: |
          cc packages/ptyx/native/c/tests/abi_harness.c \
            -std=c11 -Wall -Wextra -Werror \
            -Ipackages/ptyx/native/include \
            -Lpackages/ptyx/native/target/debug \
            -lptyx_c \
            -o "$RUNNER_TEMP/ptyx-abi-harness"
          c++ packages/ptyx/native/c/tests/abi_harness.cc \
            -std=c++17 -Wall -Wextra -Werror \
            -Ipackages/ptyx/native/include \
            -Lpackages/ptyx/native/target/debug \
            -lptyx_c \
            -o "$RUNNER_TEMP/ptyx-abi-harness-cxx"
          c++ packages/ptyx/native/dart/tests/abi_harness.cc \
            -std=c++17 -Wall -Wextra -Werror \
            -Ipackages/ptyx/native/include \
            -Ipackages/ptyx/native/dart/include \
            -o "$RUNNER_TEMP/ptyx-dart-abi-harness-cxx"
          cc packages/ptyx/native/c/tests/abi_harness.c \
            -std=c11 -Wall -Wextra -Werror -fshort-enums \
            -Ipackages/ptyx/native/include \
            -Lpackages/ptyx/native/target/debug \
            -lptyx_c \
            -o "$RUNNER_TEMP/ptyx-abi-harness-short-enums"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness"
            DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness-cxx"
            "$RUNNER_TEMP/ptyx-dart-abi-harness-cxx"
            DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness-short-enums"
          else
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness"
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness-cxx"
            "$RUNNER_TEMP/ptyx-dart-abi-harness-cxx"
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug" \
              "$RUNNER_TEMP/ptyx-abi-harness-short-enums"
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LIBRARY="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug/libptyx_c.dylib"
          else
            LIBRARY="$GITHUB_WORKSPACE/packages/ptyx/native/target/debug/libptyx_c.so"
          fi
          dart run packages/ptyx/tool/verify_abi.dart "$LIBRARY"
      - name: locate Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products "*" -property installationPath
          if (-not $installation) {
            throw "Visual Studio installation was not found"
          }
          $developerCommand = "$installation\Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $developerCommand)) {
            throw "Visual Studio developer command was not found"
          }
          "PTYX_VSDEVCMD=$developerCommand" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: run C ABI harness
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PTYX_VS_TARGET=x64"
          if /I "%RUNNER_ARCH%"=="ARM64" set "PTYX_VS_TARGET=arm64"
          call "%PTYX_VSDEVCMD%" -host_arch=x64 -arch=%PTYX_VS_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c11 /W4 /WX ^
            /Ipackages/ptyx/native/include ^
            packages/ptyx/native/c/tests/abi_harness.c ^
            /Fe:%RUNNER_TEMP%\ptyx-abi-harness.exe ^
            /link /LIBPATH:packages/ptyx/native/target/debug ptyx_c.dll.lib
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            /Ipackages/ptyx/native/include ^
            packages/ptyx/native/c/tests/abi_harness.cc ^
            /Fe:%RUNNER_TEMP%\ptyx-abi-harness-cxx.exe ^
            /link /LIBPATH:packages/ptyx/native/target/debug ptyx_c.dll.lib
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            /Ipackages/ptyx/native/include ^
            /Ipackages/ptyx/native/dart/include ^
            packages/ptyx/native/dart/tests/abi_harness.cc ^
            /Fe:%RUNNER_TEMP%\ptyx-dart-abi-harness-cxx.exe
          if errorlevel 1 exit /b %errorlevel%
          set "PATH=%GITHUB_WORKSPACE%\packages\ptyx\native\target\debug;%PATH%"
          "%RUNNER_TEMP%\ptyx-abi-harness.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\ptyx-abi-harness-cxx.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\ptyx-dart-abi-harness-cxx.exe"
          if errorlevel 1 exit /b %errorlevel%
          dart run packages/ptyx/tool/verify_abi.dart "%GITHUB_WORKSPACE%\packages\ptyx\native\target\debug\ptyx_c.dll"
          if errorlevel 1 exit /b %errorlevel%
      - if: runner.os != 'Windows'
        run: cargo test --manifest-path packages/ptyx/native/broker/Cargo.toml
      - name: run Unix broker ownership harness
        if: runner.os != 'Windows'
        run: cargo run --manifest-path packages/ptyx/native/broker/Cargo.toml
      - run: >-
          cargo clippy --manifest-path packages/ptyx/native/Cargo.toml
          -p ptyx-c -p ptyx-dart -p ptyx
          --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo clippy --manifest-path packages/ptyx/native/broker/Cargo.toml --all-targets -- -D warnings
      - run: >-
          cargo doc --manifest-path packages/ptyx/native/Cargo.toml
          -p ptyx-c -p ptyx-dart -p ptyx --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: validate Rust crate package contents
        if: matrix.os == 'linux-x64'
        run: |
          env -u PTYX_BROKER_BINARY \
            cargo package --manifest-path packages/ptyx/native/Cargo.toml \
            -p ptyx
      - if: runner.os != 'Windows'
        run: cargo doc --manifest-path packages/ptyx/native/broker/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: validate C ABI documentation
        if: matrix.os == 'linux-x64'
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/doxygen.tar.gz" \
            https://www.doxygen.nl/files/doxygen-1.17.0.linux.bin.tar.gz
          echo \
            "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2  $RUNNER_TEMP/doxygen.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/doxygen.tar.gz" \
            --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/doxygen-1.17.0/bin/doxygen" packages/ptyx/Doxyfile

  clippy:
    name: clippy
    needs: [changes, dart-quality]
    if: needs.changes.outputs.ptyx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            packages/ptyx/native/target
          key: ptyx-clippy-${{ hashFiles('packages/ptyx/native/Cargo.lock') }}
          restore-keys: ptyx-clippy-
      - name: install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup component add --toolchain 1.95.0 clippy
      - name: configure Dart SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v dart)")")"
          printf "DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
          printf "PTYX_DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
      - name: build broker
        run: |
          cargo build --manifest-path packages/ptyx/native/broker/Cargo.toml --release
          printf "PTYX_BROKER_BINARY=%s\n" \
            "$GITHUB_WORKSPACE/packages/ptyx/native/target/release/ptyx-broker" \
            >> "$GITHUB_ENV"
      - run: cargo clippy --manifest-path packages/ptyx/native/broker/Cargo.toml --all-targets --all-features -- -D warnings
      - run: >-
          cargo clippy --manifest-path packages/ptyx/native/Cargo.toml
          -p ptyx-c -p ptyx-dart -p ptyx
          --all-targets --all-features -- -D warnings

  rust-dependencies:
    name: rust-dependencies
    needs: [changes]
    if: needs.changes.outputs.ptyx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate production dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: packages/ptyx/native/Cargo.toml
          arguments: >-
            --locked
            --config packages/ptyx/native/deny.toml
          command: check
          command-arguments: >-
            -D warnings
            advisories
            licenses
            sources
      - name: validate fuzz dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: packages/ptyx/native/fuzz/Cargo.toml
          arguments: >-
            --locked
            --config packages/ptyx/native/deny.toml
          command: check
          command-arguments: >-
            -D warnings
            advisories
            licenses
            sources

  checks:
    name: checks
    if: always()
    needs:
      - changes
      - dart-quality
      - dart-tests
      - rust
      - clippy
      - rust-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PTYX_CHANGED: ${{ needs.changes.outputs.ptyx }}
          DART_QUALITY_RESULT: ${{ needs.dart-quality.result }}
          DART_TESTS_RESULT: ${{ needs.dart-tests.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          RUST_DEPENDENCIES_RESULT: ${{ needs.rust-dependencies.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed."
            exit 1
          fi

          if [[ "$PTYX_CHANGED" == "false" ]]; then
            echo "No PTYX-affecting files changed; required checks pass."
            exit 0
          fi

          if [[ "$PTYX_CHANGED" != "true" ]]; then
            echo "Change detection did not report a PTYX result."
            exit 1
          fi

          for result in \
            "$DART_QUALITY_RESULT" \
            "$DART_TESTS_RESULT" \
            "$RUST_RESULT" \
            "$CLIPPY_RESULT" \
            "$RUST_DEPENDENCIES_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required PTYX check did not succeed: $result"
              exit 1
            fi
          done
