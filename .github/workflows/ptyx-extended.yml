name: ptyx-extended

on:
  workflow_call:
    inputs:
      soak_seconds:
        description: Per-target exact-integrity soak duration
        required: false
        type: string
        default: "300"
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Per-target exact-integrity soak duration
        required: false
        default: "300"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ptyx-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address-leak-sanitizer
            sanitizer: address
            options: detect_leaks=1:halt_on_error=1
          - name: thread-sanitizer
            sanitizer: thread
            options: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - name: install pinned nightly with sanitizer standard library sources
        run: >-
          rustup toolchain install nightly-2026-07-20
          --profile minimal
          --component rust-src
      - name: configure Dart SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v dart)")")"
          printf "DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
          printf "PTYX_DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
      - name: build target broker for controller sanitizer tests
        id: build-broker
        continue-on-error: true
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ASAN_OPTIONS: ${{ matrix.options }}
          TSAN_OPTIONS: ${{ matrix.options }}
        run: |
          cargo +nightly-2026-07-20 build \
            -Zbuild-std \
            --target x86_64-unknown-linux-gnu \
            --manifest-path packages/ptyx/native/broker/Cargo.toml
          printf "PTYX_BROKER_BINARY=%s\n" \
            "$GITHUB_WORKSPACE/packages/ptyx/native/target/x86_64-unknown-linux-gnu/debug/ptyx-broker" \
            >> "$GITHUB_ENV"
      - name: run controller sanitizer tests
        id: controller-tests
        continue-on-error: true
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ASAN_OPTIONS: ${{ matrix.options }}
          TSAN_OPTIONS: ${{ matrix.options }}
        run: >-
          cargo +nightly-2026-07-20 test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --manifest-path packages/ptyx/native/Cargo.toml
          --all-targets
      - name: run broker sanitizer tests
        id: broker-tests
        continue-on-error: true
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ASAN_OPTIONS: ${{ matrix.options }}
          TSAN_OPTIONS: ${{ matrix.options }}
        run: >-
          cargo +nightly-2026-07-20 test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --manifest-path packages/ptyx/native/broker/Cargo.toml
          --all-targets
      - name: write sanitizer evidence
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build-broker.outcome }}
          CONTROLLER_OUTCOME: ${{ steps.controller-tests.outcome }}
          BROKER_OUTCOME: ${{ steps.broker-tests.outcome }}
        run: |
          mkdir -p sanitizer-evidence
          jq -n \
            --arg revision "$GITHUB_SHA" \
            --arg sanitizer "${{ matrix.sanitizer }}" \
            --arg build_outcome "$BUILD_OUTCOME" \
            --arg controller_outcome "$CONTROLLER_OUTCOME" \
            --arg broker_outcome "$BROKER_OUTCOME" \
            --arg toolchain "nightly-2026-07-20" \
            --arg target "x86_64-unknown-linux-gnu" \
            '{
              schema: 1,
              suite: "ptyx-sanitizer",
              revision: $revision,
              tree_dirty: false,
              sanitizer: $sanitizer,
              toolchain: $toolchain,
              target: $target,
              checks: {
                broker_build: ($build_outcome == "success"),
                controller_tests: ($controller_outcome == "success"),
                broker_tests: ($broker_outcome == "success")
              },
              outcomes: {
                broker_build: $build_outcome,
                controller_tests: $controller_outcome,
                broker_tests: $broker_outcome
              }
            }' > "sanitizer-evidence/${{ matrix.sanitizer }}.json"
      - name: retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptyx-sanitizer-${{ matrix.sanitizer }}-${{ github.sha }}
          path: sanitizer-evidence/${{ matrix.sanitizer }}.json
          if-no-files-found: error
          retention-days: 90
      - name: enforce sanitizer result
        if: steps.build-broker.outcome != 'success' || steps.controller-tests.outcome != 'success' || steps.broker-tests.outcome != 'success'
        run: exit 1

  miri:
    name: miri-unsafe-model-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - name: install pinned Miri
        run: >-
          rustup toolchain install nightly-2026-07-20
          --profile minimal
          --component miri
      - name: configure Dart SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v dart)")")"
          printf "DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
          printf "PTYX_DART_SDK=%s\n" "$SDK" >> "$GITHUB_ENV"
      - run: cargo +nightly-2026-07-20 miri setup
      - name: run controller model tests under Miri
        env:
          PTYX_BROKER_BINARY: /bin/true
          PTYX_SKIP_DART_BRIDGE: "1"
          PTYX_MODEL_ITERATIONS: "512"
        run: |
          cargo +nightly-2026-07-20 miri test \
            --manifest-path packages/ptyx/native/ptyx/Cargo.toml \
            --lib generation_registry_model_rejects_every_retired_handle
          cargo +nightly-2026-07-20 miri test \
            --manifest-path packages/ptyx/native/ptyx/Cargo.toml \
            --lib exhausted_generations_retire_the_slot_instead_of_wrapping
      - name: run broker decoder tests under Miri
        run: |
          for test in \
            generation_identity_rejects_zero_components \
            protocol_rejects_oversize_payloads \
            spawn_v2_decoder_round_trips_all_owned_fields \
            spawn_decoder_rejects_arbitrary_bytes_without_panicking
          do
            cargo +nightly-2026-07-20 miri test \
              --manifest-path packages/ptyx/native/broker/Cargo.toml \
              "$test"
          done

  fuzz:
    name: broker-protocol-decoders-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - run: rustup toolchain install nightly-2026-07-20 --profile minimal
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: fuzz both production protocol decoders with AddressSanitizer
        working-directory: packages/ptyx/native/fuzz
        run: |
          dart run tool/generate_corpus.dart --check
          cargo +nightly-2026-07-20 fuzz build broker_decoder
          cargo +nightly-2026-07-20 fuzz build controller_decoder
          cargo_fuzz_version="$(cargo fuzz --version)"
          suite_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          broker_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          broker_started_epoch="$(date +%s)"
          set +e
          cargo +nightly-2026-07-20 fuzz run broker_decoder \
            -- -max_total_time=600 -timeout=5
          broker_exit_code=$?
          set -e
          broker_finished_epoch="$(date +%s)"
          broker_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          controller_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          controller_started_epoch="$(date +%s)"
          set +e
          cargo +nightly-2026-07-20 fuzz run controller_decoder \
            -- -max_total_time=600 -timeout=5
          controller_exit_code=$?
          set -e
          controller_finished_epoch="$(date +%s)"
          controller_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          tree_dirty=true
          if git diff --quiet && git diff --cached --quiet; then
            tree_dirty=false
          fi
          suite_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          passed=false
          broker_duration="$((broker_finished_epoch - broker_started_epoch))"
          controller_duration="$((controller_finished_epoch - controller_started_epoch))"
          if (( broker_exit_code == 0 &&
                controller_exit_code == 0 &&
                broker_duration >= 600 &&
                controller_duration >= 600 )); then
            passed=true
          fi
          jq -n \
            --arg revision "$GITHUB_SHA" \
            --arg cargo_fuzz_version "$cargo_fuzz_version" \
            --arg suite_started_at "$suite_started_at" \
            --arg suite_finished_at "$suite_finished_at" \
            --arg broker_started_at "$broker_started_at" \
            --arg broker_finished_at "$broker_finished_at" \
            --arg controller_started_at "$controller_started_at" \
            --arg controller_finished_at "$controller_finished_at" \
            --argjson tree_dirty "$tree_dirty" \
            --argjson passed "$passed" \
            --argjson broker_exit_code "$broker_exit_code" \
            --argjson broker_duration "$broker_duration" \
            --argjson controller_exit_code "$controller_exit_code" \
            --argjson controller_duration "$controller_duration" \
            '{
              schema: 1,
              suite: "ptyx-fuzz-acceptance",
              revision: $revision,
              tree_dirty: $tree_dirty,
              passed: $passed,
              platform: "linux",
              architecture: "x64",
              cargo_fuzz_version: $cargo_fuzz_version,
              command: ["ptyx-extended", "fuzz"],
              checks: {
                broker_decoder:
                  ($broker_exit_code == 0 and $broker_duration >= 600),
                controller_decoder:
                  ($controller_exit_code == 0 and $controller_duration >= 600)
              },
              started_at_utc: $suite_started_at,
              finished_at_utc: $suite_finished_at,
              targets: {
                broker_decoder: {
                  exit_code: $broker_exit_code,
                  duration_seconds: $broker_duration,
                  command: [
                    "cargo", "+nightly-2026-07-20", "fuzz", "run",
                    "broker_decoder", "--", "-max_total_time=600", "-timeout=5"
                  ],
                  started_at_utc: $broker_started_at,
                  finished_at_utc: $broker_finished_at
                },
                controller_decoder: {
                  exit_code: $controller_exit_code,
                  duration_seconds: $controller_duration,
                  command: [
                    "cargo", "+nightly-2026-07-20", "fuzz", "run",
                    "controller_decoder", "--", "-max_total_time=600",
                    "-timeout=5"
                  ],
                  started_at_utc: $controller_started_at,
                  finished_at_utc: $controller_finished_at
                }
              }
            }' > fuzz-evidence.json

          if [[ "$passed" != true ]]; then
            exit 1
          fi
      - name: retain fuzz artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptyx-broker-protocol-fuzz-${{ github.sha }}
          path: |
            packages/ptyx/native/fuzz/artifacts
            packages/ptyx/native/fuzz/corpus
            packages/ptyx/native/fuzz/fuzz-evidence.json
          if-no-files-found: warn
          retention-days: 90

  soak:
    name: soak-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-x64
            runner: macos-15-intel
          - os: macos-arm64
            runner: macos-15
          - os: windows-x64
            runner: windows-2025
          - os: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: dart pub get
      - name: compile standalone fixture
        working-directory: packages/ptyx
        run: |
          FIXTURE="$RUNNER_TEMP/ptyx-fixture"
          if [[ "$RUNNER_OS" == "Windows" ]]; then FIXTURE="$FIXTURE.exe"; fi
          dart compile exe benchmark/fixture.dart -o "$FIXTURE"
          printf "PTYX_FIXTURE_EXECUTABLE=%s\n" "$FIXTURE" >> "$GITHUB_ENV"
      - name: run exact-integrity lifecycle soak
        working-directory: packages/ptyx
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '1800' }}
        run: |
          progress="$RUNNER_TEMP/soak-${{ matrix.os }}.progress.jsonl"
          retained_progress="soak-${{ matrix.os }}.progress.jsonl"
          printf '{"schema":1,"phase":"runner-started"}\n' > "$progress"
          set +e
          dart run tool/soak.dart "$SOAK_SECONDS" \
            --output=soak-${{ matrix.os }}.json \
            --progress="$progress"
          command_rc=$?
          set -e
          printf '{"schema":1,"phase":"command-exited","details":{"exit_code":%s}}\n' \
            "$command_rc" >> "$progress"
          cp "$progress" "$retained_progress"
          if (( command_rc != 0 )); then
            exit "$command_rc"
          fi
          dart run tool/validate_ci_result.dart \
            soak soak-${{ matrix.os }}.json
          printf '{"schema":1,"phase":"result-validated"}\n' >> "$retained_progress"
      - name: capture Windows soak failure evidence
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/ptyx
        run: |
          $path = "windows-events-${{ matrix.os }}.txt"
          "Application events relevant to the failed ptyx soak" |
            Set-Content -Path $path
          Get-WinEvent -FilterHashtable @{
            LogName = "Application"
            StartTime = (Get-Date).AddMinutes(-50)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Message -match "dart|ptyx|conhost|OpenConsole"
            } |
            Format-List TimeCreated, Id, ProviderName, LevelDisplayName, Message |
            Out-File -FilePath $path -Append
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptyx-soak-${{ matrix.os }}-${{ github.sha }}
          path: |
            packages/ptyx/soak-${{ matrix.os }}.json
            packages/ptyx/soak-${{ matrix.os }}.progress.jsonl
            packages/ptyx/windows-events-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 90

  scorecard:
    name: scorecard-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-x64
            runner: macos-15-intel
          - os: macos-arm64
            runner: macos-15
          - os: windows-x64
            runner: windows-2025
          - os: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: dart pub get
      - name: compile standalone fixture
        working-directory: packages/ptyx
        run: |
          FIXTURE="$RUNNER_TEMP/ptyx-fixture"
          if [[ "$RUNNER_OS" == "Windows" ]]; then FIXTURE="$FIXTURE.exe"; fi
          dart compile exe benchmark/fixture.dart -o "$FIXTURE"
          printf "PTYX_FIXTURE_EXECUTABLE=%s\n" "$FIXTURE" >> "$GITHUB_ENV"
      - name: run correctness-gated diagnostic scorecard
        working-directory: packages/ptyx
        run: |
          progress="$RUNNER_TEMP/scorecard-${{ matrix.os }}.progress.jsonl"
          retained_progress="scorecard-${{ matrix.os }}.progress.jsonl"
          printf '{"schema":1,"phase":"runner-started"}\n' > "$progress"
          set +e
          dart run benchmark/scorecard.dart all \
            --warmups=1 \
            --repetitions=3 \
            --bytes=134217728 \
            --output=scorecard-${{ matrix.os }}.json \
            --progress="$progress"
          command_rc=$?
          set -e
          printf '{"schema":1,"phase":"command-exited","details":{"exit_code":%s}}\n' \
            "$command_rc" >> "$progress"
          cp "$progress" "$retained_progress"
          if (( command_rc != 0 )); then
            exit "$command_rc"
          fi
          dart run tool/validate_ci_result.dart \
            scorecard scorecard-${{ matrix.os }}.json
          printf '{"schema":1,"phase":"result-validated"}\n' >> "$retained_progress"
      - name: capture Windows scorecard failure evidence
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/ptyx
        run: |
          $path = "windows-events-${{ matrix.os }}.txt"
          "Application events relevant to the failed ptyx scorecard" |
            Set-Content -Path $path
          Get-WinEvent -FilterHashtable @{
            LogName = "Application"
            StartTime = (Get-Date).AddMinutes(-35)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Message -match "dart|ptyx|conhost|OpenConsole"
            } |
            Format-List TimeCreated, Id, ProviderName, LevelDisplayName, Message |
            Out-File -FilePath $path -Append
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptyx-scorecard-${{ matrix.os }}-${{ github.sha }}
          path: |
            packages/ptyx/scorecard-${{ matrix.os }}.json
            packages/ptyx/scorecard-${{ matrix.os }}.progress.jsonl
            packages/ptyx/windows-events-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 90

  hosted-long-soak:
    name: hosted-six-hour-soak-linux-x64
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: dart pub get
      - name: compile standalone fixture
        working-directory: packages/ptyx
        run: |
          dart compile exe benchmark/fixture.dart -o "$RUNNER_TEMP/ptyx-fixture"
          printf "PTYX_FIXTURE_EXECUTABLE=%s\n" \
            "$RUNNER_TEMP/ptyx-fixture" >> "$GITHUB_ENV"
      - name: retain a five-hour, forty-five-minute hosted soak result
        working-directory: packages/ptyx
        run: dart run tool/soak.dart 20700 --output=soak-linux-x64.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptyx-soak-linux-x64-${{ github.sha }}
          path: packages/ptyx/soak-linux-x64.json
          if-no-files-found: error
          retention-days: 90
